name: Publish Docker image to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

  build:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: echo "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Set lowercase repository
        run: |
          echo "LOWERCASE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push single-arch
        id: build_attempt_1
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VITE_REACT_APP_SYSTEM_NAME=二五云API
            VITE_REACT_APP_FAVICON=https://res.25y.cn/favicon.ico
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ env.LOWERCASE_REPO }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # GitHub Actions has no native step retry, so the second attempt is a
      # conditional step that runs only when the first one failed. This absorbs
      # transient Docker Hub failures (for example a 502 while resolving a
      # digest-pinned base image manifest) without adding a third-party retry
      # action and without replacing the official build action with a
      # hand-rolled buildx CLI call.
      - name: Wait before retry
        if: ${{ failure() && steps.build_attempt_1.outcome == 'failure' }}
        run: sleep 30

      - name: Build & push single-arch (retry)
        if: ${{ failure() && steps.build_attempt_1.outcome == 'failure' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VITE_REACT_APP_SYSTEM_NAME=二五云API
            VITE_REACT_APP_FAVICON=https://res.25y.cn/favicon.ico
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ env.LOWERCASE_REPO }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  manifest:
    name: Create multi-arch manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase repository
        run: |
          echo "LOWERCASE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/$LOWERCASE_REPO:$VERSION \
            ghcr.io/$LOWERCASE_REPO:$VERSION-amd64 \
            ghcr.io/$LOWERCASE_REPO:$VERSION-arm64

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/$LOWERCASE_REPO:latest \
            ghcr.io/$LOWERCASE_REPO:latest-amd64 \
            ghcr.io/$LOWERCASE_REPO:latest-arm64

      - name: Manifest summary
        run: |
          echo "### GHCR Multi-arch Manifest ($VERSION)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ghcr.io/$LOWERCASE_REPO:$VERSION >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
